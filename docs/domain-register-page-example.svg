<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .nav { fill: #ffffff; }
      .blue { fill: #0f5bdd; }
      .light-blue { fill: #eaf2ff; }
      .red-bg { fill: #fff1f0; }
      .panel { fill: #ffffff; stroke: #d8e1ef; stroke-width: 2; }
      .cart { fill: #f8fafc; }
      .text { font: 400 24px Arial, "Microsoft YaHei", sans-serif; fill: #253044; }
      .small { font: 400 20px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .title { font: 700 30px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .tab { font: 700 25px Arial, "Microsoft YaHei", sans-serif; fill: #0f5bdd; }
      .btn { font: 700 26px Arial, "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .call { fill: #fff7ed; stroke: #f97316; stroke-width: 3; rx: 16; }
      .call-text { font: 700 22px Arial, "Microsoft YaHei", sans-serif; fill: #9a3412; }
      .call-small { font: 400 19px Arial, "Microsoft YaHei", sans-serif; fill: #9a3412; }
      .good { fill: #ecfdf5; stroke: #14b8a6; stroke-width: 3; rx: 16; }
      .good-text { font: 700 22px Arial, "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .arrow { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .green-arrow { stroke: #14b8a6; stroke-width: 4; fill: none; marker-end: url(#greenhead); }
      .input { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .dash { stroke: #f97316; stroke-width: 4; stroke-dasharray: 8 8; fill: none; rx: 10; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f97316"/>
    </marker>
    <marker id="greenhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <rect class="nav" x="0" y="0" width="1500" height="72"/>
  <text class="tab" x="72" y="46">域名注册</text>
  <rect class="blue" x="72" y="66" width="90" height="5"/>
  <text class="text" x="230" y="46">AI 域名推荐</text>
  <text class="text" x="385" y="46">批量注册</text>
  <text class="text" x="540" y="46">域名转入</text>

  <rect class="light-blue" x="74" y="110" width="1350" height="58"/>
  <text class="small" x="105" y="148">提示公告区域，可忽略，不影响注册。</text>

  <rect class="red-bg" x="74" y="205" width="1350" height="70"/>
  <text class="small" x="105" y="248">维护提示区域，可忽略；只要查询和购买按钮可用即可。</text>

  <rect class="input" x="88" y="355" width="760" height="78"/>
  <text class="small" x="118" y="404">输入您要注册的域名，如 example</text>
  <line x1="830" y1="370" x2="830" y2="418" stroke="#d8e1ef" stroke-width="2"/>
  <text class="title" x="885" y="405">.cn⌄</text>
  <rect class="blue" x="975" y="355" width="160" height="78"/>
  <text class="btn" x="1028" y="405">查询</text>

  <rect class="panel" x="88" y="470" width="1047" height="340"/>
  <text class="title" x="430" y="640">查询结果区域</text>
  <text class="small" x="335" y="680">可注册时，选择最便宜的普通域名加入购物车。</text>

  <rect class="cart" x="1170" y="355" width="270" height="455"/>
  <text class="title" x="1195" y="405">域名购物车</text>
  <text class="small" x="1225" y="610">加入后这里会显示域名</text>
  <rect class="blue" x="1195" y="750" width="210" height="60"/>
  <text class="btn" x="1262" y="789">立即购买</text>

  <rect class="dash" x="88" y="355" width="760" height="78"/>
  <path class="arrow" d="M420 250 C420 300 420 330 420 352"/>
  <rect class="call" x="235" y="140" width="430" height="96"/>
  <text class="call-text" x="260" y="178">第一步：只输入域名前缀</text>
  <text class="call-small" x="260" y="210">例如 bjutcampus、bjutmarket、campusflow</text>

  <rect class="dash" x="860" y="355" width="105" height="78"/>
  <path class="arrow" d="M1030 250 C1000 300 950 330 925 352"/>
  <rect class="call" x="830" y="140" width="370" height="96"/>
  <text class="call-text" x="855" y="178">第二步：后缀选 .cn</text>
  <text class="call-small" x="855" y="210">不要优先选 .top / .xyz 等冷门后缀</text>

  <rect class="dash" x="975" y="355" width="160" height="78"/>
  <path class="arrow" d="M1140 505 C1120 465 1090 440 1065 432"/>
  <rect class="call" x="1000" y="520" width="360" height="96"/>
  <text class="call-text" x="1025" y="558">第三步：点击“查询”</text>
  <text class="call-small" x="1025" y="590">如果不可注册，换一个名字再查</text>

  <rect class="good" x="125" y="725" width="560" height="105"/>
  <text class="good-text" x="150" y="765">选择标准</text>
  <text class="small" x="150" y="798">能注册、首年价格低、不是“溢价域名”、续费价格可接受。</text>

  <path class="green-arrow" d="M1135 650 C1180 670 1210 700 1255 748"/>
  <rect class="good" x="820" y="725" width="310" height="105"/>
  <text class="good-text" x="845" y="765">加入购物车后</text>
  <text class="small" x="845" y="798">右侧点击“立即购买”。</text>
</svg>
